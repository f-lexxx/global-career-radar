name: Refresh verified job listings
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC = 05:00 Ghana time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official employer job boards
        run: python scripts/collect_jobs.py
      - name: Commit refreshed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Daily job listings refresh"
          git push
