name: Deploy Global Career Radar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Publish after the 05:00 UTC job refresh (Ghana time is UTC).
    - cron: "15 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Refresh verified job listings
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC = 05:00 Ghana time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official employer job boards
        run: python scripts/collect_jobs.py
      - name: Commit refreshed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Daily job listings refresh"
          git push
